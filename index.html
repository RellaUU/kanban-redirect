<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RellaUU的个人看板</title>
<style>
:root{
  --bg:#F5F1E8; --panel:#FBF8F1; --ink:#3A332A; --muted:#9A8F7C;
  --line:#E3D9C4; --accent:#B08D57; --accent-soft:#EFE4CF; --radius:14px;
}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:-apple-system,"PingFang SC","Microsoft YaHei",sans-serif;background:var(--bg);color:var(--ink);line-height:1.7;-webkit-font-smoothing:antialiased}
.serif{font-family:Georgia,"Songti SC","STSong",serif}
.brand{font-family:'Didot','Baskerville',"Source Han Sans SC","Noto Sans CJK SC","PingFang SC",sans-serif;font-weight:300;letter-spacing:1px;white-space:nowrap}
.en{font-family:'Didot','Baskerville','Hoefler Text',Georgia,serif;font-style:italic;letter-spacing:3px;font-weight:400}

/* 登录遮罩 */
#loginOverlay{position:fixed;inset:0;background:radial-gradient(900px 500px at 50% 20%,#F7F2E8,#EDE6D6);display:flex;align-items:center;justify-content:center;z-index:50;padding:20px}
.loginCard{background:var(--panel);border:1px solid var(--line);border-radius:20px;padding:40px 34px;width:100%;max-width:340px;text-align:center;box-shadow:0 20px 50px rgba(80,60,30,.12)}
.loginCard .star{font-size:20px;color:var(--accent);margin-bottom:4px;opacity:.8}
.loginCard h1{font-size:24px;letter-spacing:2px}
.loginCard .sub{color:var(--muted);font-size:12px;letter-spacing:2px;margin:8px 0 22px}
.loginCard input[type=text],.loginCard input[type=password]{width:100%;padding:12px 14px;border:1px solid var(--line);border-radius:10px;background:#fff;font-size:15px;text-align:center;letter-spacing:2px;color:var(--ink);outline:none;margin-top:12px}
.loginCard input:focus{border-color:var(--accent)}
.loginCard button{margin-top:16px;width:100%;padding:12px;border:none;border-radius:10px;background:var(--accent);color:#fff;font-size:15px;letter-spacing:3px;cursor:pointer;transition:.2s}
.loginCard button:hover{background:#9c7a47}
.remember{margin-top:14px;font-size:12px;color:var(--muted);display:flex;align-items:center;justify-content:center;gap:6px}
.remember input{accent-color:var(--accent)}
.loginErr{color:#b5524a;font-size:12px;min-height:16px;margin-top:10px}
.switch{margin-top:14px;font-size:12px;color:var(--accent);cursor:pointer;letter-spacing:1px}
.netnote{font-size:11px;color:#b9ad97;margin-top:10px;min-height:14px}
.modesel{margin-top:20px}
.mlabel{font-size:11px;color:var(--muted);letter-spacing:3px;margin-bottom:8px}
.mopts{display:flex;gap:10px}
.mopt{flex:1;padding:11px 0;border:1px solid var(--line);background:#fff;border-radius:10px;font-size:14px;letter-spacing:3px;color:var(--muted);cursor:pointer;transition:.2s;font-family:inherit}
.mopt.active{background:var(--accent);color:#fff;border-color:var(--accent)}
.mopt:hover{border-color:var(--accent)}

header{position:relative;overflow:hidden;text-align:center;padding:46px 26px 30px}
header svg{position:absolute;inset:0;width:100%;height:100%;opacity:.5;pointer-events:none}
header h1{position:relative;font-size:27px;letter-spacing:2px}
header .headtop{position:relative;display:flex;align-items:baseline;justify-content:center;gap:14px;flex-wrap:wrap}
header .topdate{font-size:13px;color:var(--muted);letter-spacing:2px;white-space:nowrap}
header .sub{position:relative;color:var(--muted);font-size:12.5px;margin-top:8px;letter-spacing:3px}
.wrap{max-width:1080px;margin:0 auto;padding:6px 24px 60px}

/* 桌面双栏排版 */
.layout{display:block}
@media(min-width:900px){
  .layout{display:grid;grid-template-columns:420px 1fr;gap:24px;align-items:start}
}
.card{background:var(--panel);border:1px solid var(--line);border-radius:var(--radius);padding:26px;margin-bottom:22px;box-shadow:0 10px 30px rgba(120,95,50,.06);animation:fadeUp .6s ease both}
.layout>.card:nth-child(2){animation-delay:.16s}
.card h2{font-size:19px;letter-spacing:3px;text-align:center;display:flex;align-items:center;justify-content:center;gap:10px}
.card .h2sub{color:var(--muted);font-size:12px;margin:6px 0 18px;text-align:center;letter-spacing:1px}
.zodiac{font-size:18px;color:var(--accent)}
.divider{width:46px;height:1px;background:var(--accent);margin:0 auto 18px;opacity:.6;position:relative}
.divider::after{content:"\2726";position:absolute;top:-10px;left:50%;transform:translateX(-50%);background:var(--panel);padding:0 6px;color:var(--accent);font-size:11px}

/* 圆形进度 */
.ring-wrap{position:relative;width:96px;height:96px;margin:6px auto 20px}
.ring{transform:rotate(-90deg);width:96px;height:96px}
.ring-bg{fill:none;stroke:var(--accent-soft);stroke-width:7}
.ring-fg{fill:none;stroke:url(#goldGrad);stroke-width:7;stroke-linecap:round;transition:stroke-dashoffset .4s ease}
.ring-label{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1.1}
.ring-label b{font-size:24px;color:var(--ink);font-family:Georgia,serif}
.ring-label span{font-size:12px;color:var(--muted);margin-top:2px}
.ring-label em{font-size:10px;color:var(--muted);font-style:normal;letter-spacing:2px;margin-top:4px}
.ring-wrap.full{filter:drop-shadow(0 0 7px rgba(176,141,87,.55))}

/* 待办分组 */
.todo-groups{margin-top:4px}
.tabs{display:flex;gap:8px;margin:2px 2px 16px}
.tab{flex:1;padding:9px 0;border:1px solid var(--line);background:#fff;border-radius:20px;font-size:13px;letter-spacing:3px;color:var(--muted);cursor:pointer;transition:.2s;font-family:inherit}
.tab.active{background:var(--accent-soft);color:var(--accent);border-color:var(--accent)}
.tgroup{display:none}
.tgroup.active{display:block}
.ghead{display:flex;align-items:center;gap:10px;font-size:13px;letter-spacing:4px;color:var(--accent);margin:18px 2px 10px}
.ghead::before,.ghead::after{content:"";flex:1;height:1px;background:var(--line)}
.gcount{font-family:Georgia,serif;color:var(--muted);font-size:12px;letter-spacing:0}
.todo{display:flex;align-items:flex-start;gap:12px;padding:12px 4px;border-bottom:1px solid var(--line)}
.todo:last-child{border-bottom:none}
.num{font-family:Georgia,serif;font-size:14px;color:var(--accent);width:22px;flex:0 0 auto;margin-top:1px}
.box{width:20px;height:20px;border:2px solid var(--accent);border-radius:50%;flex:0 0 auto;margin-top:2px;cursor:pointer;position:relative;transition:.2s}
.todo.done .box{background:var(--accent)}
.todo.done .box:after{content:"";position:absolute;left:5px;top:1px;width:5px;height:9px;border:solid #FBF8F1;border-width:0 2px 2px 0;transform:rotate(45deg)}
.todo .t{font-size:15px;flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.todo.done .t{color:var(--muted);text-decoration:line-through}
.tag{font-size:11px;color:var(--accent);background:var(--accent-soft);padding:2px 9px;border-radius:20px;white-space:nowrap;flex:0 0 auto}
.outoggle{width:26px;height:22px;flex:0 0 auto;border:1px solid var(--line);background:none;color:var(--accent);border-radius:14px;font-size:12px;cursor:pointer;transition:.2s;letter-spacing:1px;margin-top:1px}
.outoggle:hover{background:var(--accent-soft)}
.del{color:var(--muted);cursor:pointer;font-size:16px;flex:0 0 auto;opacity:.5;transition:.2s;background:none;border:none;padding:0 2px;margin-top:2px}
.del:hover{opacity:1;color:#b5524a}
/* 星期限定项：今天不做，置灰展示 */
.todo.muted{opacity:.5}
.todo.muted .t{color:var(--muted)}
.todo.muted .box{border-color:var(--line);cursor:not-allowed;background:none}
.todo.muted .box:after{display:none}
.todo.muted .outoggle{display:none}
.notoday{font-size:10px;color:#9A8F7C;background:#efe9dc;padding:2px 9px;border-radius:20px;white-space:nowrap;flex:0 0 auto;letter-spacing:1px}

.addbar{margin-top:18px;text-align:center}
.addbtn{background:none;border:1px dashed var(--accent);color:var(--accent);padding:9px 20px;border-radius:24px;font-size:14px;letter-spacing:2px;cursor:pointer;transition:.2s}
.addbtn:hover{background:var(--accent-soft)}
.addform{margin-top:14px;display:none;gap:8px;align-items:center;justify-content:center;flex-wrap:wrap}
.addform input{flex:1;min-width:160px;padding:10px 12px;border:1px solid var(--line);border-radius:9px;background:#fff;font-size:14px;color:var(--ink);outline:none}
.addform input:focus{border-color:var(--accent)}
.addform .ok{background:var(--accent);color:#fff;border:none;padding:10px 18px;border-radius:9px;cursor:pointer;letter-spacing:2px}
.addform .no{background:none;border:1px solid var(--line);color:var(--muted);padding:10px 16px;border-radius:9px;cursor:pointer}

/* 板块 */
#panelList{display:grid;grid-template-columns:1fr;gap:14px}
@media(min-width:900px){ #panelList{grid-template-columns:1fr 1fr} }
.panel{background:var(--panel);border:1px solid var(--line);border-radius:12px;padding:18px;box-shadow:0 6px 18px rgba(120,95,50,.05)}
.panel h3{font-size:15px;display:flex;align-items:center;gap:8px;margin-bottom:9px;letter-spacing:1px;flex-wrap:wrap}
.panel .ic{color:var(--accent)}
.pctrl{margin-left:auto;display:flex;gap:6px;flex:0 0 auto}
.pctrl button{background:none;border:1px solid var(--line);color:var(--accent);width:24px;height:24px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;transition:.2s}
.pctrl button:hover{background:var(--accent-soft)}
.pupdated{font-size:11px;color:var(--muted);margin:-4px 0 8px;letter-spacing:1px}
.pupdated::before{content:"\2726 ";color:var(--accent);opacity:.7}
.pitems{display:flex;flex-direction:column}
.pitem{display:flex;align-items:flex-start;gap:8px;padding:7px 6px;border-radius:8px;transition:.15s}
.pitem:hover{background:var(--accent-soft)}
.ptext{flex:1;font-size:13.5px;color:#6B6253;outline:none;line-height:1.6;min-height:20px;word-break:break-word}
.ptext:focus{color:var(--ink)}
.pdel{flex:0 0 auto;color:var(--muted);background:none;border:none;cursor:pointer;font-size:17px;opacity:0;transition:.2s;padding:0 2px;line-height:1}
.pitem:hover .pdel{opacity:.55}
.pdel:hover{opacity:1;color:#b5524a}

.note{font-size:11px;color:var(--muted);margin-top:14px;text-align:center;letter-spacing:1px}
.logout{position:fixed;top:14px;right:16px;font-size:12px;color:var(--muted);background:rgba(255,255,255,.6);border:1px solid var(--line);padding:5px 12px;border-radius:20px;cursor:pointer;z-index:40}
@keyframes fadeUp{from{opacity:0;transform:translateY(10px)}to{opacity:1;transform:none}}
@media(max-width:480px){header h1,.loginCard h1{font-size:20px;letter-spacing:1px}}
/* ===== 手机端排版优化：更好的阅读与触控体验 ===== */
@media(max-width:600px){
  .wrap{padding:6px 13px 46px}
  header{padding:34px 16px 22px}
  header h1{font-size:22px;letter-spacing:1px}
  .card{padding:20px 15px;margin-bottom:16px}
  .card h2{font-size:17px;letter-spacing:2px}
  .h2sub{font-size:11.5px}
  .ring-wrap{margin:4px auto 16px}
  .tabs{gap:10px;margin-bottom:12px}
  .tab{padding:11px 0;font-size:13px}
  .ghead{font-size:12px;letter-spacing:3px;margin:14px 2px 8px}
  .todo{padding:13px 2px;align-items:flex-start}
  .todo .t{white-space:normal;line-height:1.5;overflow:visible;text-overflow:clip}
  .num{margin-top:3px}
  .box{margin-top:3px}
  .tag{font-size:10px;padding:2px 7px}
  .addform{flex-direction:column;align-items:stretch}
  .addform input{flex:1 1 auto;min-width:0;width:100%}
  .addform .ok,.addform .no{width:100%}
  .panel{padding:15px 13px}
  .panel h3{font-size:14px}
  .pctrl button{width:28px;height:28px}
  .pitem{padding:9px 4px}
  .ptext{font-size:14px;line-height:1.65}
  .pupdated{font-size:10.5px}
  .stocklive{padding:9px 10px;margin-bottom:9px}
  .livetitle{font-size:10.5px}
  .stk{font-size:11.5px;padding:3px 8px}
  .stcard{padding:10px 11px}
  .stname{font-size:13.5px}
  .stnote{font-size:12px}
  .hotlink{font-size:10.5px;padding:5px 9px;margin:0 6px 8px 0}
  .plabel{font-size:10.5px}
  .pdisc{font-size:10px}
  .words{gap:8px}
  .word{padding:10px 11px}
  .wword{font-size:14px}
  /* 触屏没有 hover：删除按钮改为常显，才能点得到 */
  .pitem .pdel{opacity:.55}
  .stkdel{opacity:.5;font-size:16px}
  /* 实时行情竖向铺开，价格一眼可读 */
  .stockrow{flex-direction:column;align-items:stretch;gap:6px}
  .stk{display:block;width:100%;text-align:left;font-size:12px}
  .stnote{line-height:1.6}
  .livetitle{margin-bottom:6px}
  .stmeta{font-size:11px}
}
@media(max-width:400px){
  header h1{font-size:20px;letter-spacing:1px}
  .card{padding:18px 12px;margin-bottom:14px}
  .card h2{font-size:16px;letter-spacing:1px}
  .panel{padding:14px 11px}
  .panel h3{font-size:13.5px}
  .ptext{font-size:13.5px;line-height:1.6}
  .todo .t{font-size:14px}
  .tab{font-size:12px;letter-spacing:2px}
  .ghead{font-size:11px;letter-spacing:2px}
  .hotlink,.plabel{font-size:10px}
  .stcard{padding:9px 10px}
  .stname{font-size:13px}
  .pctrl button{width:26px;height:26px}
}

/* 英语单词卡 */
.words{display:grid;grid-template-columns:1fr;gap:10px}
@media(min-width:640px){ .words{grid-template-columns:1fr 1fr} }
.word{background:var(--accent-soft);border-radius:10px;padding:11px 13px}
.wtop{display:flex;align-items:center;gap:8px}
.wword{font-size:15px;font-weight:600;color:var(--accent);letter-spacing:.5px}
.wph{font-size:12px;color:var(--muted);font-family:Georgia,serif}
.wspk{border:none;background:#fff;border-radius:50%;width:24px;height:24px;cursor:pointer;font-size:12px;margin-left:auto;box-shadow:0 1px 3px rgba(0,0,0,.08);transition:.2s}
.wspk:hover{background:var(--accent);transform:scale(1.06)}
.wmean{font-size:13px;color:var(--ink);margin-top:4px}
.wex{font-size:12.5px;color:#6B6253;margin-top:3px;font-style:italic}
.wsc{font-size:11.5px;color:var(--muted);margin-top:4px;line-height:1.5}
.pall{margin:2px 0 10px;background:var(--accent);color:#fff;border:none;padding:7px 14px;border-radius:18px;font-size:12px;letter-spacing:1px;cursor:pointer;transition:.2s}
.pall:hover{background:#9c7a47}
/* 股票实时行情 */
.stocklive{background:#FBF1E2;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:10px}
.livetitle{font-size:11px;color:var(--muted);letter-spacing:1px;margin-bottom:7px}
.stockrow{display:flex;flex-wrap:wrap;gap:7px}
.stk{font-size:12px;padding:3px 9px;border-radius:16px;background:#fff;border:1px solid var(--line);white-space:nowrap}
.stk b{font-family:Georgia,serif}
.stk.up{color:#c0392b} /* 涨 · 红 */
.stk.down{color:#1e8449} /* 跌 · 绿 */
.pdisc{font-size:10.5px;color:#b9ad97;margin:-2px 0 8px;letter-spacing:.5px}
/* 链接型条目（抖音/小红书） */
.pitem.link{cursor:pointer;border-radius:8px}
.pitem.link .ptext{color:#5a5246}
.pitem.link .pext{margin-left:auto;flex:0 0 auto;color:var(--accent);font-size:12px;opacity:.55;align-self:center;white-space:nowrap}
.pitem.link:hover{background:var(--accent-soft)}
.pitem.link .pdel{opacity:0;position:absolute;right:6px;top:6px}
.pitem.link:hover .pdel{opacity:.55}
/* 股票卡片 */
.stcard{position:relative;background:#FBF1E2;border:1px solid var(--line);border-radius:10px;padding:10px 12px;margin-bottom:8px;transition:.15s}
.stcard:hover{background:#f6e7cf;box-shadow:0 4px 12px rgba(120,95,50,.1)}
.stmain{display:block;text-decoration:none;color:inherit}
.stmain:hover .stname{color:var(--accent)}
.stcard .sthead{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.stname{font-size:14px;font-weight:600;color:var(--ink)}
.stheat{font-size:11px;color:#fff;background:var(--accent);padding:1px 8px;border-radius:12px;white-space:nowrap}
.starrow{margin-left:auto;color:var(--accent);font-size:12px;white-space:nowrap}
.stnote{font-size:12.5px;color:#6B6253;margin-top:5px;line-height:1.55}
.stmeta{font-size:11px;color:var(--muted);margin-top:4px}
.stmeta.up{color:#c0392b}.stmeta.down{color:#1e8449}
.stkdel{position:absolute;top:5px;right:7px;opacity:0;background:none;border:none;cursor:pointer;font-size:17px;color:#b9ad97;line-height:1;padding:0 2px;z-index:2}
.stcard:hover .stkdel{opacity:.55}
.stkdel:hover{opacity:1;color:#b5524a}
.stguba{color:var(--accent);text-decoration:none}
.stguba:hover{text-decoration:underline}
/* 板块级入口链接 */
.hotlink{display:inline-flex;align-items:center;gap:4px;font-size:11.5px;color:var(--accent);background:var(--accent-soft);border:1px solid var(--line);padding:4px 10px;border-radius:14px;margin:0 6px 10px 0;cursor:pointer;text-decoration:none;transition:.2s}
.hotlink:hover{background:var(--accent);color:#fff}
.plabel{font-size:11px;color:var(--muted);letter-spacing:1px;margin:2px 0 4px}
/* 我的账号 */
.acctip{font-size:11px;color:var(--muted);margin:-4px 0 10px;line-height:1.6}
.accrow{display:flex;align-items:center;gap:8px;margin:0 0 9px;flex-wrap:wrap}
.acclab{font-size:12px;color:var(--accent);min-width:48px;font-weight:600}
.accinp{flex:1;min-width:140px;font-size:12px;padding:7px 10px;border:1px solid var(--line);border-radius:10px;background:var(--accent-soft);color:var(--text);outline:none}
.accinp:focus{border-color:var(--accent)}
.accopen,.accpub{font-size:11px;color:#fff;background:var(--accent);border:none;padding:7px 12px;border-radius:10px;cursor:pointer;text-decoration:none;white-space:nowrap}
.accpub{background:var(--muted)}
@media(max-width:600px){.accrow{gap:6px}.acclab{min-width:40px}.accinp{min-width:120px;font-size:13px}}
</style>
</head>
<body>

<div id="loginOverlay">
  <div class="loginCard">
    <div class="star">✶</div>
    <h1 class="brand">RellaUU的个人看板</h1>
    <div class="sub"><span class="en">STAR JOURNEY</span></div>
    <div class="modesel" id="modeSel">
      <div class="mlabel">当前状态</div>
      <div class="mopts">
        <button type="button" class="mopt" data-mode="out">出 门</button>
        <button type="button" class="mopt" data-mode="home">在 家</button>
      </div>
    </div>
    <input type="password" id="guardInput" placeholder="访问口令（轻保护）" maxlength="20" inputmode="numeric" autocomplete="off">
    <button id="enterBtn">进 入 看 板</button>
    <div class="loginErr" id="loginErr"></div>
    <div class="netnote" id="netnote">纯本地版 · 数据保存在本机浏览器</div>
  </div>
</div>

<button class="logout" id="logoutBtn" style="display:none">退出</button>

<header>
<svg viewBox="0 0 800 150" preserveAspectRatio="xMidYMid slice" xmlns="http://www.w3.org/2000/svg">
 <g fill="#B08D57">
  <circle cx="90" cy="60" r="1.8"/><circle cx="180" cy="40" r="1.4"/><circle cx="270" cy="70" r="1.6"/>
  <circle cx="360" cy="35" r="1.3"/><circle cx="470" cy="65" r="1.7"/><circle cx="560" cy="45" r="1.4"/>
  <circle cx="660" cy="75" r="1.5"/><circle cx="740" cy="50" r="1.3"/><circle cx="410" cy="110" r="1.3"/>
  <circle cx="610" cy="115" r="1.4"/>
 </g>
 <g stroke="#B08D57" stroke-width="0.7" opacity="0.45" fill="none">
  <polyline points="90,60 180,40 270,70 360,35 470,65 560,45 660,75 740,50"/>
  <polyline points="270,70 410,110 610,115"/>
 </g>
</svg>
<div class="headtop">
  <h1 class="brand">RellaUU的个人看板</h1>
  <span class="topdate" id="date"></span>
</div>
<div class="sub"><span class="en">STAR JOURNEY</span> · 每日待办与灵感</div>
</header>

<div class="wrap">
 <div class="layout">
   <section class="card">

function synthCoin(){
  try{
    audioCtx = audioCtx || new (window.AudioContext || window.webkitAudioContext)();
    if (audioCtx.state === 'suspended') audioCtx.resume();
    const now = audioCtx.currentTime;
    const notes = [1046.5, 1568];
    notes.forEach((f, i) => {
      const t = now + i * 0.085;
      const o1 = audioCtx.createOscillator(), g1 = audioCtx.createGain();
      const o2 = audioCtx.createOscillator(), g2 = audioCtx.createGain();
      o1.type = 'sine'; o1.frequency.value = f;
      o2.type = 'sine'; o2.frequency.value = f * 2;
      g1.gain.setValueAtTime(0, t);
      g1.gain.linearRampToValueAtTime(0.18, t + 0.004);
      g1.gain.exponentialRampToValueAtTime(0.0005, t + 0.22);
      g2.gain.setValueAtTime(0, t);
      g2.gain.linearRampToValueAtTime(0.06, t + 0.004);
      g2.gain.exponentialRampToValueAtTime(0.0004, t + 0.18);
      o1.connect(g1).connect(audioCtx.destination);
      o2.connect(g2).connect(audioCtx.destination);
      o1.start(t); o1.stop(t + 0.24);
      o2.start(t); o2.stop(t + 0.20);
    });
  }catch(e){}
}

function defaultBoard(){ return { custom: [], out: {}, days: {}, panels: {}, accounts: { douyin:'', xhs:'' } }; }
function getChecked(key){ return !!(board.days[ds] && board.days[ds][key]); }
function setChecked(key, v){ board.days[ds] = board.days[ds] || {}; board.days[ds][key] = v; }
function getOut(key, def){ return key[0] === 'd' ? (board.out[key] !== undefined ? board.out[key] : def) : def; }
function setOut(key, v, def){ if (key[0] === 'd'){ if (v === def) delete board.out[key]; else board.out[key] = v; } }

function loadBoard(){
  try { board = JSON.parse(localStorage.getItem('kanban_board')) || defaultBoard(); }
  catch(e){ board = defaultBoard(); }
}
function saveBoard(){ localStorage.setItem('kanban_board', JSON.stringify(board)); }
function ensurePanels(){
  let changed = false;
  if ((board.seedVer || 0) < SEED_VER){
    PANEL_ORDER.forEach(id => { board.panels[id] = { items: pickBatch(id), updated: null }; });
    board.seedVer = SEED_VER; changed = true;
  } else {
    PANEL_ORDER.forEach(id => {
      if (!board.panels[id] || !Array.isArray(board.panels[id].items) || board.panels[id].items.length === 0){
        board.panels[id] = { items: pickBatch(id), updated: null };
        changed = true;
      }
    });
  }
  // 股票库改版：仅替换股票板块为 5 只非科技潜力股（不影响其它板块与你手动编辑的条目）
  if ((board.stockVer || 0) < STOCK_VER){
    board.panels.stock = { items: pickBatch('stock'), updated: null };
    board.stockVer = STOCK_VER;
    changed = true;
  }
  // 情感短句库升级：仅刷新情感板块为新内容（不影响其它板块与你手动编辑的条目）
  if ((board.emotionVer || 0) < EMOTION_VER){
    board.panels.emotion = { items: pickBatch('emotion'), updated: null };
    board.emotionVer = EMOTION_VER;
    board.emotionDay = ds; // 与每日更新共用同一天标记，避免重复刷新
    changed = true;
  }
  // 情感短句每日更新：跨天自动换一批新短语（不影响其它板块与你手动编辑的条目）
  if (board.emotionDay !== ds){
    board.panels.emotion = { items: pickBatch('emotion'), updated: null };
    board.emotionDay = ds;
    changed = true;
  }
  // 电影书籍库升级：仅刷新电影书籍板块为 100+ 豆瓣经典池（不影响其它板块与你手动编辑的条目）
  if ((board.mediaVer || 0) < MEDIA_VER){
    board.panels.media = { items: pickBatch('media'), updated: null };
    board.mediaVer = MEDIA_VER;
    board.mediaDay = ds;
    changed = true;
  }
  // 电影书籍每日更新：跨天自动换一批新推荐（不影响其它板块与你手动编辑的条目）
  if (board.mediaDay !== ds){
    board.panels.media = { items: pickBatch('media'), updated: null };
    board.mediaDay = ds;
    changed = true;
  }
  return changed;
}

// ---------- 进度（圆形环）----------
const RING_C = 2 * Math.PI * 44;
const ringFg = document.querySelector('.ring-fg');
const doneN = document.getElementById('doneN');
const totalN = document.getElementById('totalN');
function updateProgress(){
  let outT = 0, outD = 0, inT = 0, inD = 0;
  DEFAULT_TODOS.forEach((o,i) => {
    if (!visibleToday(o)) return;
    const k = 'd'+i, isOut = getOut(k, o.out), d = getChecked(k);
    if (isOut){ outT++; if (d) outD++; } else { inT++; if (d) inD++; }
  });
  board.custom.forEach((t,i) => {
    const k = 'c'+i, isOut = !!t.out, d = getChecked(k);
    if (isOut){ outT++; if (d) outD++; } else { inT++; if (d) inD++; }
  });
  const ringTotal = viewMode === 'out' ? outT : inT;
  const ringDone  = viewMode === 'out' ? outD : inD;
  const pct = ringTotal ? ringDone / ringTotal : 0;
  if (ringFg){ ringFg.style.strokeDasharray = RING_C; ringFg.style.strokeDashoffset = RING_C * (1 - pct); }
  if (doneN) doneN.textContent = ringDone;
  if (totalN) totalN.textContent = ringTotal;
  const rw = document.querySelector('.ring-wrap'); if (rw) rw.classList.toggle('full', pct === 1 && ringTotal > 0);
  const em = document.querySelector('.ring-label em'); if (em) em.textContent = pct === 1 ? '已全部完成' : (viewMode === 'out' ? '出门待办' : '在家待办');
  const oc = document.getElementById('outCnt'); if (oc) oc.textContent = outD + '/' + outT;
  const ic = document.getElementById('inCnt'); if (ic) ic.textContent = inD + '/' + inT;
  const to2 = document.getElementById('tabOut'); if (to2) to2.textContent = outD + '/' + outT;
  const ti2 = document.getElementById('tabIn'); if (ti2) ti2.textContent = inD + '/' + inT;
}

// ---------- 渲染待办（出门 / 在家）----------
const todoOut = document.getElementById('todoOut');
const todoIn = document.getElementById('todoIn');
function renderTodos(){
  todoOut.innerHTML = ''; todoIn.innerHTML = '';
  let outN = 0, inN = 0;
  DEFAULT_TODOS.forEach((o,i) => {
    const muted = !visibleToday(o);
    const k = 'd'+i, isOut = getOut(k, o.out);
    if (isOut){ outN++; todoOut.appendChild(makeTodo(o, k, false, isOut, muted, outN)); }
    else { inN++; todoIn.appendChild(makeTodo(o, k, false, isOut, muted, inN)); }
  });
  board.custom.forEach((t,i) => {
    const k = 'c'+i;
    (t.out ? todoOut : todoIn).appendChild(makeTodo({t:t.t, tag:'自定义'}, k, true, t.out));
  });
  updateProgress();
  applyView();
}

const todoTabs = document.getElementById('todoTabs');
function applyView(){
  if (todoTabs) todoTabs.querySelectorAll('.tab').forEach(b => b.classList.toggle('active', b.dataset.v === viewMode));
  document.querySelectorAll('.tgroup').forEach(g => g.classList.toggle('active', g.dataset.g === viewMode));
}
if (todoTabs) todoTabs.querySelectorAll('.tab').forEach(b => b.addEventListener('click', () => {
  viewMode = b.dataset.v; localStorage.setItem('kanban_mode', viewMode); applyView(); updateProgress();
}));
function makeTodo(o, key, isCustom, outVal, muted, num){
  const d = document.createElement('div');
  d.className = 'todo' + (getChecked(key) ? ' done' : '') + (muted ? ' muted' : '');
  if (num === undefined) num = isCustom ? '＋' : (parseInt(key.slice(1)) + 1);
  d.innerHTML = '<div class="num">'+num+'</div><div class="box"></div>'
    + '<div class="t" title="'+o.t+'">'+o.t+'</div>'
    + (o.tag ? '<span class="tag">'+o.tag+'</span>' : '')
    + (muted ? '<span class="notoday">今天不做</span>' : '')
    + '<button class="outoggle" title="切换 出门 / 在家">'+(outVal ? '出' : '家')+'</button>'
    + (isCustom ? '<button class="del" title="删除">×</button>' : '');
  if (muted) return d;
  d.querySelector('.box').addEventListener('click', () => {
    const was = d.classList.contains('done');
    d.classList.toggle('done');
    const nowDone = d.classList.contains('done');
    setChecked(key, nowDone);
    saveBoard(); updateProgress();
    if (nowDone && !was) playCoin();
  });
  d.querySelector('.outoggle').addEventListener('click', () => {
    if (key[0] === 'd'){ const def = DEFAULT_TODOS[parseInt(key.slice(1))].out; setOut(key, !getOut(key, def), def); }
    else { board.custom[parseInt(key.slice(1))].out = !board.custom[parseInt(key.slice(1))].out; }
    saveBoard(); renderTodos();
  });
  if (isCustom) d.querySelector('.del').addEventListener('click', () => {
    board.custom.splice(parseInt(key.slice(1)), 1);
    saveBoard(); renderTodos();
  });
  return d;
}

let _enVoice = null;
function pickEnglishVoice(){
  if (!('speechSynthesis' in window)) return null;
  const vs = speechSynthesis.getVoices() || [];
  if (!vs.length) return null;
  const prefer = ['Google US English','Microsoft Aria Online (Natural)','Microsoft Aria','Samantha','Daniel','Google UK English','Microsoft David','Microsoft Zira','Alex','Victoria'];
  for (const name of prefer){
    const v = vs.find(x => x.name && x.name.indexOf(name) >= 0 && x.lang && x.lang.toLowerCase().indexOf('en') === 0);
    if (v) return v;
  }
  const cloud = vs.find(x => x.lang && x.lang.toLowerCase().indexOf('en') === 0 && x.localService === false);
  if (cloud) return cloud;
  return vs.find(x => x.lang && x.lang.toLowerCase().indexOf('en') === 0) || null;
}
function ensureVoice(){
  if (_enVoice) return _enVoice;
  _enVoice = pickEnglishVoice();
  return _enVoice;
}
if ('speechSynthesis' in window){
  ensureVoice();
  speechSynthesis.onvoiceschanged = () => { _enVoice = null; ensureVoice(); };
}
function speak(text, lang){
  try{
    if (!('speechSynthesis' in window)) return;
    speechSynthesis.cancel();
    const u = new SpeechSynthesisUtterance(text);
    const v = ensureVoice();
    if (v) u.voice = v;
    u.lang = (v && v.lang) || lang || 'en-US';
    u.rate = 0.9; u.pitch = 1; u.volume = 1;
    speechSynthesis.speak(u);
  }catch(e){}
}

function pickBatch(id){
  const lib = (PANEL_LIB[id] && PANEL_LIB[id].items) || [];
  const n = PANEL_PICK[id] || 6;
  const pool = lib.slice(); const out = [];
  while (out.length < n && pool.length){
    out.push(pool.splice(Math.floor(Math.random() * pool.length), 1)[0]);
  }
  return out;
}

// 股票实时行情（腾讯 gtimg JSONP，大陆可达，失败则仅显示内置分析）
const STOCK_CODES = [
  {code:'sh603605', market:'sh', num:'603605'},
  {code:'sz300015', market:'sz', num:'300015'},
  {code:'sh601888', market:'sh', num:'601888'},
  {code:'sh600887', market:'sh', num:'600887'},
  {code:'sz002714', market:'sz', num:'002714'}
];
function loadStockLive(){
  return new Promise((resolve) => {
    const s = document.createElement('script');
    s.src = 'https://qt.gtimg.cn/q=' + STOCK_CODES.map(c => c.code).join(',') + '&_=' + Date.now();
    let done = false;
    const finish = () => { if (done) return; done = true; try{ s.remove(); }catch(e){} resolve(); };
    s.onload = () => {
      try{
        stockMap = {};
        STOCK_CODES.forEach(c => {
          const raw = (window['v_' + c.code] || '').replace(/^"|"$/g, '');
          const p = raw.split('~');
          const price = parseFloat(p[3]);
          const pct = parseFloat(p[31]);
          const turn = parseFloat(p[38]);
          stockMap[c.code] = {
            code: c.code, market: c.market, num: c.num,
            name: p[1] || c.code,
            price: isNaN(price) ? '' : price,
            pct: isNaN(pct) ? 0 : pct,
            turn: isNaN(turn) ? null : turn
          };
        });
        stockData = STOCK_CODES.map(c => stockMap[c.code]).filter(Boolean);
      }catch(e){ stockData = null; }
      finish();
    };
    s.onerror = finish;
    document.body.appendChild(s);
    setTimeout(finish, 4000);
  });
}

function loadPanel(id){

  if (p && Array.isArray(p.items) && p.items.length) return p;
  return { items: pickBatch(id), updated: null };
}

  defs.forEach(d => {
    const row = document.createElement('div'); row.className = 'accrow';
    const lab = document.createElement('span'); lab.className = 'acclab'; lab.textContent = d.name;
    const inp = document.createElement('input'); inp.className = 'accinp'; inp.type = 'text'; inp.placeholder = d.ph; inp.value = acc[d.key] || '';
    const save = () => { acc[d.key] = inp.value.trim(); saveBoard(); };
    inp.addEventListener('blur', save);
    inp.addEventListener('keydown', e => { if (e.key === 'Enter'){ save(); inp.blur(); } });

    open.href = acc[d.key] || '#';
    open.addEventListener('click', e => { if (!acc[d.key]){ e.preventDefault(); inp.focus(); } });
    const pub = document.createElement('a'); pub.className = 'accpub'; pub.textContent = '去发布'; pub.href = d.pub; pub.target = '_blank'; pub.rel = 'noopener';
    row.appendChild(lab); row.appendChild(inp); row.appendChild(open); row.appendChild(pub);
    wrap.appendChild(row);
  });
}

function makeItem(id, idx, txt){
  const row = document.createElement('div');
  row.className = 'pitem';
  const p = document.createElement('p');
  p.className = 'ptext'; p.contentEditable = 'true'; p.spellcheck = false; p.textContent = txt;
  const del = document.createElement('button');
  del.className = 'pdel'; del.title = '删除'; del.textContent = '×';
  row.appendChild(p); row.appendChild(del);
  p.addEventListener('blur', () => {
    const d = loadPanel(id);
    const v = p.textContent.trim();
    const orig = d.items[idx];
    if (v === ''){ if (orig !== undefined){ d.items.splice(idx, 1); d.updated = Date.now(); board.panels[id] = d; saveBoard(); renderPanels(); } return; }
    if (v !== orig){ d.items[idx] = v; d.updated = Date.now(); board.panels[id] = d; saveBoard(); renderPanels(); }
  });
  del.addEventListener('click', () => {
    const d = loadPanel(id); d.items.splice(idx, 1); d.updated = Date.now();
    board.panels[id] = d; saveBoard(); renderPanels();
  });
  return row;
}

// 抖音/小红书：点击关键词跳转平台热搜词条
function makeTopicCard(id, idx, item){
  const row = document.createElement('div'); row.className = 'pitem link';
  const p = document.createElement('p'); p.className = 'ptext'; p.contentEditable = 'true'; p.spellcheck = false;
  p.textContent = (item && item.t) ? item.t : '';
  row.appendChild(p);
  const kw = (item && item.kw) ? item.kw : '热门';
  const ext = document.createElement('a'); ext.className = 'pext'; ext.textContent = '🔥 看#' + kw + '#热搜';
  ext.href = id === 'douyin'
    ? 'https://www.douyin.com/search/' + encodeURIComponent(kw)
    : 'https://www.xiaohongshu.com/search_result?keyword=' + encodeURIComponent(kw);
  ext.target = '_blank'; ext.rel = 'noopener';
  ext.addEventListener('click', (e) => e.stopPropagation());
  row.appendChild(ext);
  const del = document.createElement('button'); del.className = 'pdel'; del.textContent = '×'; del.title = '删除';
  row.appendChild(del);
  p.addEventListener('blur', () => {
    const d = loadPanel(id); const v = p.textContent.trim();
    if (v === ''){ d.items.splice(idx, 1); }
    else { if (!d.items[idx] || typeof d.items[idx] === 'string') d.items[idx] = { t:'', kw:kw }; d.items[idx].t = v; }
    d.updated = Date.now(); board.panels[id] = d; saveBoard(); renderPanels();
  });
  del.addEventListener('click', () => { const d = loadPanel(id); d.items.splice(idx, 1); d.updated = Date.now(); board.panels[id] = d; saveBoard(); renderPanels(); });
  return row;
}

// 股票：小白友好分析卡，点击跳东方财富深度分析 + 股吧讨论
function makeStockCard(id, idx, item){
  if (!item || !item.name){
    const row = document.createElement('div'); row.className = 'pitem';
    const p = document.createElement('p'); p.className = 'ptext'; p.contentEditable = 'true'; p.spellcheck = false;
    p.textContent = (item && item.note) ? item.note : '';
    const del = document.createElement('button'); del.className = 'pdel'; del.textContent = '×'; del.title = '删除';
    row.appendChild(p); row.appendChild(del);
    p.addEventListener('blur', () => {
      const d = loadPanel(id); const v = p.textContent.trim();
      if (v === ''){ d.items.splice(idx, 1); } else { d.items[idx] = { note:v }; }
      d.updated = Date.now(); board.panels[id] = d; saveBoard(); renderPanels();
    });
    del.addEventListener('click', () => { const d = loadPanel(id); d.items.splice(idx, 1); d.updated = Date.now(); board.panels[id] = d; saveBoard(); renderPanels(); });
    return row;
  }
  const card = document.createElement('div'); card.className = 'stcard';
  const del = document.createElement('button'); del.className = 'stkdel'; del.textContent = '×'; del.title = '删除';
  card.appendChild(del);
  const main = document.createElement('a'); main.className = 'stmain';
  main.href = 'https://quote.eastmoney.com/' + item.market + item.code + '.html';
  main.target = '_blank'; main.rel = 'noopener';
  const head = document.createElement('div'); head.className = 'sthead';
  const nm = document.createElement('span'); nm.className = 'stname';
  nm.textContent = item.name + ' (' + item.market.toUpperCase() + item.code + ')';
  head.appendChild(nm);
  if (item.heat){ const hb = document.createElement('span'); hb.className = 'stheat'; hb.textContent = item.heat; head.appendChild(hb); }
  const arr = document.createElement('span'); arr.className = 'starrow'; arr.textContent = '📈 深度分析 ›';
  head.appendChild(arr);
  main.appendChild(head);
  const note = document.createElement('div'); note.className = 'stnote'; note.textContent = item.note;
  main.appendChild(note);
  card.appendChild(main);
  const meta = document.createElement('div'); meta.className = 'stmeta';
  const key = item.market + item.code;
  const lv = stockMap[key];
  let liveTxt = '';
  if (lv && lv.price){ const up = parseFloat(lv.pct) >= 0; meta.classList.add(up ? 'up' : 'down'); liveTxt = '实时 ' + lv.price + '  ' + (up ? '+' : '') + lv.pct + '%'; }
  else liveTxt = '点📈看实时行情';
  meta.innerHTML = liveTxt + ' · <a href="https://guba.eastmoney.com/list,' + item.market + item.code + '.html" target="_blank" rel="noopener" class="stguba">💬 股吧讨论(多人推荐)</a>';
  card.appendChild(meta);
  del.addEventListener('click', (e) => { e.preventDefault(); e.stopPropagation(); const d = loadPanel(id); d.items.splice(idx, 1); d.updated = Date.now(); board.panels[id] = d; saveBoard(); renderPanels(); });
  return card;
}

function setNet(msg){ if (netnote) netnote.textContent = msg; }
function showApp(){ overlay.style.display = 'none'; logoutBtn.style.display = 'block'; }
function showLogin(){ overlay.style.display = 'flex'; logoutBtn.style.display = 'none'; }

const guardInput = document.getElementById('guardInput');
const loginErr = document.getElementById('loginErr');
if (guardInput){
  guardInput.addEventListener('keydown', e => { if (e.key === 'Enter') quickEnter(); });
  guardInput.addEventListener('focus', () => { if (loginErr) loginErr.textContent = ''; });
}
function quickEnter(){
  const g = guardInput ? guardInput.value.trim() : '';
  if (g !== GUARD){
    if (loginErr) loginErr.textContent = '访问口令错误，请重新输入';
    if (guardInput) guardInput.focus();
    return;
  }
  localStorage.setItem('kanban_unlocked', '1');
  enterApp();
}
enterBtn.addEventListener('click', quickEnter);

logoutBtn.addEventListener('click', () => {
  localStorage.removeItem('kanban_unlocked');
  showLogin();
});

function enterApp(){
  showApp();
  loadBoard();
  if (ensurePanels()) saveBoard();
  renderTodos();
  renderPanels();
  renderAccounts();
  loadStockLive().then(() => renderPanels());
  setNet('已就绪 · 数据保存在本机浏览器');
}

// ---------- 启动 ----------
(function init(){
  if (localStorage.getItem('kanban_unlocked') === '1'){ enterApp(); return; }
  showLogin();
})();
